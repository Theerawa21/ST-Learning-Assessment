<script>
(()=>{const U=ST,{state:S,escape:e}=U;
 U.pages.dashboard=async()=>{const d=await U.callApi('dashboard',{year:S.year});S.dashboard=d;const metrics=[['รายวิชาทั้งหมด',d.totalSubjects,'book','','ยังไม่จัดทำ '+d.notStarted+' รายวิชา'],['ฉบับร่าง',d.drafts,'file','blue','บันทึกและกลับมาแก้ไขได้'],['รอตรวจสอบ',d.pending,'clock','orange','ส่งกลับแก้ไข '+d.returned+' รายวิชา'],['อนุมัติแล้ว',d.approved,'shield','green','ผ่านการตรวจสอบครบ 3 ระดับ']];U.setContent(U.heading('ภาพรวมการดำเนินงาน','ติดตามสถานะการจัดทำและตรวจสอบแบบวิเคราะห์รายวิชาในปีการศึกษานี้',`<button class="button primary" data-action="go-subjects">${U.icon('plus')}จัดทำแบบวิเคราะห์</button>`)+`<div class="stats">${metrics.map(([label,value,ic,color,foot])=>`<div class="stat ${color}"><div class="stat-label">${label}<span class="stat-icon">${U.icon(ic)}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${e(foot)}</div></div>`).join('')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-header"><div><h2>รายวิชาที่ต้องดำเนินการ</h2><p>เอกสารล่าสุดในขอบเขตที่คุณรับผิดชอบ</p></div>${U.button('ดูทั้งหมด →','go-subjects','','link')}</div><div class="panel-body" style="padding-bottom:0"><form class="toolbar" data-form="dashboard-search"><div class="search-box">${U.icon('search')}<input name="query" aria-label="ค้นหารายวิชาจากแดชบอร์ด" placeholder="ค้นหารายวิชา รหัสวิชา หรือชื่อรายวิชา…"></div><button class="button" type="submit">ค้นหา</button></form></div><div class="table-wrap"><table><thead><tr><th>รายวิชา</th><th>ระดับชั้น</th><th>สถานะ</th><th>การดำเนินการ</th></tr></thead><tbody>${d.recent.map(r=>`<tr><td><strong>${e(r.subject.name)}</strong><small>${e(r.subject.code)}</small></td><td>${e(r.subject.grade)}</td><td>${U.status(r.status)}</td><td>${U.button('เปิดเอกสาร','open-analysis',`data-id="${e(r.id)}"`,'small')}</td></tr>`).join('')}</tbody></table></div>${!d.recent.length?U.empty('ยังไม่มีรายวิชาที่ต้องดำเนินการ','เมื่อมีการมอบหมายรายวิชาหรือเอกสารที่อยู่ในสิทธิ์ของคุณ รายการจะแสดงที่นี่'):''}</section><div class="dashboard-right"><section class="panel"><div class="panel-header"><h2>ขั้นตอนการอนุมัติ</h2></div><div class="steps">${[['ครูผู้สอน','จัดทำและส่งแบบวิเคราะห์'],['หัวหน้ากลุ่มสาระ','ตรวจความถูกต้องตามหลักสูตร'],['งานวัดและประเมินผล','ตรวจเครื่องมือและเกณฑ์ประเมิน'],['ฝ่ายวิชาการ','พิจารณาอนุมัติฉบับสมบูรณ์']].map(([title,desc],i)=>`<div class="step"><div class="step-number">${i+1}</div><div><h3>${title}</h3><p>${desc}</p></div></div>`).join('')}</div><div class="workflow-note">เอกสารที่ส่งกลับแก้ไขจะเริ่มตรวจใหม่จากหัวหน้ากลุ่มสาระ</div></section><section class="panel progress-panel"><div class="panel-body"><div class="progress-row"><strong>ความก้าวหน้าการอนุมัติ</strong><span>${d.progress}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${d.progress}%"></div></div><small class="muted">${d.approved} จาก ${d.totalSubjects} รายวิชา</small></div></section></div></div><div class="getting-started"><div class="empty-icon">${U.icon('book')}</div><div><h3>เริ่มต้นใช้งาน</h3><p>วางแผนการประเมินให้ครอบคลุมผลลัพธ์การเรียนรู้ ด้วยขั้นตอนที่เชื่อมต่อกัน</p><div class="inline-steps"><span><b>01</b> นำเข้าหลักสูตรที่ผ่านการตรวจสอบ</span><span><b>02</b> มอบหมายรายวิชาและตัวชี้วัด</span><span><b>03</b> จัดทำแบบวิเคราะห์และส่งตรวจ</span></div></div></div>`);};
 U.actions['go-subjects']=()=>{S.subjectFilters={};S.pageNumber=1;return U.navigate('subjects');};U.actions['open-analysis']=el=>U.navigate('analysis',{documentId:el.dataset.id});U.forms['dashboard-search']=form=>{S.subjectFilters=U.formData(form);S.pageNumber=1;return U.navigate('subjects');};
})();
</script>
