<script>
(()=>{const U=ST,{state:S,escape:e}=U,checks=['ตัวชี้วัด/ผลการเรียนรู้ครบถ้วน','รหัสและข้อความถูกต้องตามหลักสูตร','การจัดกลุ่มตัวชี้วัดเหมาะสม','สิ่งที่ประเมินสอดคล้องกับตัวชี้วัด','เครื่องมือประเมินเหมาะสม','ช่วงการประเมินเหมาะสม','เกณฑ์การประเมินชัดเจน','การประเมินครอบคลุมผลลัพธ์ที่ต้องการ','ข้อมูลเป็นไปตามแนวทางของโรงเรียน'];
 U.pages.reviews=async params=>{if(params.documentId)return renderReview(params.documentId);const r=await U.callApi('queue',{page:S.reviewPage||1});U.setContent(U.heading('งานรอตรวจสอบ','เฉพาะเอกสารที่ถึงขั้นตอนตรวจและอยู่ในขอบเขตของคุณ')+`<section class="panel"><div class="table-wrap"><table><thead><tr><th>รายวิชา</th><th>ผู้จัดทำ</th><th>สถานะ</th><th>ส่งล่าสุด</th><th>ดำเนินการ</th></tr></thead><tbody>${r.items.map(d=>`<tr><td><strong>${e(d.subject.name)}</strong><small>${e(d.subject.code)} · ${e(d.subject.grade)}</small></td><td>${e(d.authorName)}</td><td>${U.status(d.status)}</td><td>${U.date(d.updatedAt)}</td><td>${U.button('ตรวจสอบเอกสาร','review-document',`data-id="${e(d.id)}"`,'small primary')}</td></tr>`).join('')}</tbody></table></div>${!r.total?U.empty('ไม่มีเอกสารรอตรวจในขณะนี้','เมื่อเอกสารผ่านขั้นตอนก่อนหน้า ระบบจะแสดงรายการที่คุณตรวจได้ที่นี่'):''}${U.pager(r,'reviews-page')}</section>`);};
 async function renderReview(documentId){const data=await U.callApi('analysis',{documentId}),model=await U.callApi('reportModel',{documentId});S.reviewDoc=data;U.setContent(U.heading('ตรวจสอบแบบวิเคราะห์',data.subject.code+' · '+data.subject.name,U.button('กลับรายการรอตรวจ','back-reviews'))+U.reportHtml(model)+`<form data-form="review-submit"><section class="panel" style="margin-top:23px"><div class="panel-header"><div><h2>แบบตรวจสอบ 9 ข้อ</h2><p>ตอบทุกข้อ · กรณีไม่เกี่ยวข้องต้องระบุเหตุผล · มีข้อที่ต้องแก้ไขจะรับรองไม่ได้</p></div>${U.status(data.document.status)}</div><div class="table-wrap"><table class="review-checklist"><thead><tr><th>รายการตรวจสอบ</th><th>ผลตรวจ</th><th>เหตุผล / ความคิดเห็น</th></tr></thead><tbody>${checks.map((label,i)=>`<tr><td>${i+1}. ${label}</td><td><select name="check-${i}" required aria-label="ผลตรวจข้อ ${i+1}"><option value="">เลือกผลตรวจ</option><option value="PASS">ผ่าน</option><option value="FIX">ต้องแก้ไข</option><option value="NA">ไม่เกี่ยวข้อง</option></select></td><td><input name="reason-${i}" placeholder="เหตุผลเมื่อไม่เกี่ยวข้อง" aria-label="เหตุผลข้อ ${i+1}"><input name="comment-${i}" placeholder="ความคิดเห็นรายข้อ" aria-label="ความคิดเห็นข้อ ${i+1}"></td></tr>`).join('')}</tbody></table></div><div class="panel-body"><div class="field"><label for="review-comment">ข้อเสนอแนะสรุป (จำเป็นเมื่อส่งกลับ)</label><textarea id="review-comment" name="comment" placeholder="ระบุแนวทางแก้ไขให้ชัดเจน"></textarea></div><details style="margin-top:15px"><summary>ความคิดเห็นรายแถว</summary>${data.groups.map((g,i)=>`<div class="field" style="margin-top:12px"><label for="row-comment-${i}">รายการที่ ${i+1}</label><input id="row-comment-${i}" name="row-${i}" placeholder="ความเห็นต่อรายการประเมินนี้"></div>`).join('')}</details><div class="form-actions"><button type="submit" name="decision" value="RETURN" class="button danger">ส่งกลับแก้ไข</button><button type="submit" name="decision" value="APPROVE" class="button primary">${data.document.status==='PENDING_ACADEMIC'?'อนุมัติฉบับสมบูรณ์':'รับรองและส่งต่อ'}</button></div></div></section></form><section class="panel" style="margin-top:23px"><div class="panel-header"><h2>ประวัติการตรวจสอบ</h2></div><div class="panel-body">${U.analysis.history(data.reviews)}</div></section>`);document.querySelector('form[data-form="review-submit"]').addEventListener('submit',ev=>{S.reviewDecision=ev.submitter?.value||'APPROVE';},true);}
 U.actions['review-document']=el=>U.navigate('reviews',{documentId:el.dataset.id});U.actions['back-reviews']=()=>U.navigate('reviews');U.actions['reviews-page']=el=>{S.reviewPage=Number(el.dataset.page);return U.navigate('reviews');};
 U.forms['review-submit']=form=>{const values=U.formData(form),p={documentId:S.reviewDoc.document.id,expectedRevision:S.reviewDoc.document.revision,expectedStatus:S.reviewDoc.document.status,decision:S.reviewDecision,comment:values.comment,checklist:checks.map((_,i)=>({number:i+1,value:values['check-'+i],reason:values['reason-'+i],comment:values['comment-'+i]})),rowComments:S.reviewDoc.groups.map((g,i)=>({rowId:g.id,comment:values['row-'+i]})).filter(r=>r.comment.trim())};if(p.decision==='RETURN'&&!p.comment.trim())throw new Error('กรุณาระบุข้อเสนอแนะก่อนส่งกลับ');if(p.decision==='APPROVE'&&p.checklist.some(c=>c.value==='FIX'))throw new Error('มีข้อที่ต้องแก้ไข กรุณาเลือกส่งกลับ');if(p.checklist.some(c=>c.value==='NA'&&!c.reason.trim()))throw new Error('กรุณาระบุเหตุผลสำหรับข้อที่ไม่เกี่ยวข้อง');S.reviewPayload=p;U.modal('ยืนยันผลการตรวจสอบ',`<p>${p.decision==='RETURN'?'ส่งกลับให้ครูแก้ไข':'รับรองผลการตรวจสอบ'} เอกสารรุ่น ${p.expectedRevision}?</p><p class="muted">ระบบจะเก็บชื่อผู้ตรวจ เวลา และข้อเสนอแนะไว้ในประวัติ</p><div class="form-actions">${U.button('ยกเลิก','close-modal')}${U.button('ยืนยัน','confirm-review','','primary')}</div>`);};
 U.actions['confirm-review']=async()=>{await U.callApi('reviewAnalysis',S.reviewPayload);U.close();U.toast('บันทึกผลการตรวจสอบแล้ว');await U.navigate('reviews');};
})();
</script>
