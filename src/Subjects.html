<script>
(()=>{const U=ST,{state:S,escape:e}=U;
 U.pages.subjects=async()=>{const f=S.subjectFilters||{},data=await U.callApi('subjects',{...f,year:S.year,page:S.pageNumber||1});S.subjects=data.items;U.setContent(U.heading('รายวิชาของฉัน','จัดการข้อมูลรายวิชาและเริ่มวิเคราะห์ตัวชี้วัดตามหลักสูตร',U.has('ADMIN')?U.button('เพิ่มรายวิชา','new-subject','','primary'):'')+`<form class="toolbar" data-form="subject-search"><div class="search-box">${U.icon('search')}<input name="query" value="${e(f.query||'')}" placeholder="ค้นหารหัสหรือชื่อรายวิชา" aria-label="ค้นหารายวิชา"></div><select name="departmentId" aria-label="กลุ่มสาระ">${U.options(S.boot.departments,'id','name',f.departmentId,'ทุกกลุ่มสาระ')}</select><select name="status" aria-label="สถานะ">${U.options(Object.entries(U.labels).map(([id,name])=>({id,name})),'id','name',f.status,'ทุกสถานะ')}</select><button type="submit" class="button">ค้นหา</button></form><section class="panel"><div class="table-wrap"><table><thead><tr><th>รายวิชา / รหัสวิชา</th><th>ระดับชั้น</th><th>ครูผู้สอน</th><th>ตัวชี้วัด</th><th>สถานะ</th><th>ดำเนินการ</th></tr></thead><tbody>${data.items.map(s=>`<tr><td><strong>${e(s.name)}</strong><small>${e(s.code)} · ${e(s.type)} · ภาคเรียน ${e(s.term)}/${e(s.year)}</small></td><td>${e(s.grade)}</td><td>${e(s.teacherNames.join(', ')||'ยังไม่มอบหมาย')}</td><td>${s.indicatorCount} ข้อ</td><td>${U.status(s.status)}</td><td><div class="table-actions">${s.documentId?U.button('เปิดแบบวิเคราะห์','open-analysis',`data-id="${e(s.documentId)}"`,'small'):U.has('TEACHER')?U.button('เริ่มวิเคราะห์','new-analysis',`data-id="${e(s.id)}"`,'small soft'):''}${U.has('ADMIN')?U.button('แก้ไข','edit-subject',`data-id="${e(s.id)}"`,'small')+U.button('กำหนดตัวชี้วัด','map-subject',`data-id="${e(s.id)}"`,'small'):''}</div></td></tr>`).join('')}</tbody></table></div>${!data.total?U.empty('ยังไม่มีรายวิชาที่ได้รับมอบหมาย','ผู้ดูแลสามารถเพิ่มรายวิชาและมอบหมายครูผู้สอนได้จากหน้านี้'):''}${U.pager(data,'subjects-page')}</section>`);};
 U.forms['subject-search']=form=>{S.subjectFilters=U.formData(form);S.pageNumber=1;return U.navigate('subjects');};U.actions['subjects-page']=el=>{S.pageNumber=Number(el.dataset.page);return U.navigate('subjects');};U.actions['new-analysis']=el=>U.navigate('analysis',{subjectId:el.dataset.id});
 async function subjectModal(subject={}){S.editSubject=subject;const users=await U.callApi('users'),teachers=users.filter(u=>u.active&&u.roles.includes('TEACHER'));const selected=subject.teacherIds||[];
 U.modal(subject.id?'แก้ไขรายวิชา':'เพิ่มรายวิชา',`<form data-form="save-subject"><div class="form-grid">${U.inputField('code','รหัสวิชา',subject.code)}${U.inputField('name','ชื่อรายวิชา',subject.name)}${U.selectField('type','ประเภทวิชา',U.options([{id:'พื้นฐาน',name:'พื้นฐาน'},{id:'เพิ่มเติม',name:'เพิ่มเติม'}],'id','name',subject.type||'พื้นฐาน',null))}${U.inputField('grade','ระดับชั้น',subject.grade)}${U.selectField('departmentId','กลุ่มสาระ',U.options(S.boot.departments,'id','name',subject.departmentId))}${U.selectField('curriculumId','หลักสูตร / รุ่น',U.options(S.boot.curricula.map(c=>({...c,label:c.name+' · '+c.version})),'id','label',subject.curriculumId))}${U.selectField('term','ภาคเรียน',U.options([{id:'1',name:'1'},{id:'2',name:'2'},{id:'3',name:'3'}],'id','name',subject.term||'1',null))}${U.inputField('year','ปีการศึกษา',subject.year||S.year)}${U.selectField('teacherIds','ครูผู้สอน',U.options(teachers,'id','name',selected,null),true,true)}<label class="checkboxes"><input name="active" type="checkbox" ${subject.active!==false?'checked':''}> เปิดใช้งานรายวิชา</label></div><div class="form-actions"><button class="button primary" type="submit">บันทึกรายวิชา</button></div></form>`);}
 U.actions['new-subject']=()=>subjectModal();U.actions['edit-subject']=el=>subjectModal(S.subjects.find(s=>s.id===el.dataset.id));
 U.forms['save-subject']=async form=>{const p=U.formData(form);p.id=S.editSubject.id;p.teacherIds=U.allSelected(form,'teacherIds');p.active=form.elements.active.checked;await U.callApi('saveSubject',p);U.close();U.toast('บันทึกรายวิชาแล้ว');await U.navigate('subjects');};
 U.actions['map-subject']=async el=>{const s=S.subjects.find(s=>s.id===el.dataset.id);S.mapSubject=s;const items=await U.allItems('indicators',{curriculumId:s.curriculumId,departmentId:s.departmentId,grade:s.grade});const result={items,total:items.length};S.mapIndicators=result.items;let selected=[];if(s.documentId){U.toast('มีเอกสารแล้ว ไม่สามารถเปลี่ยนชุดตัวชี้วัดอ้างอิงได้',true);return;}const context=await U.callApi('subjectMapping',{subjectId:s.id});selected=context.indicatorIds;U.modal('กำหนดตัวชี้วัด: '+s.name,`<form data-form="map-indicators"><div class="alert">เลือกตัวชี้วัดที่รายวิชาต้องครอบคลุมทั้งหมด ก่อนเริ่มทำแบบวิเคราะห์</div><div class="indicator-list" style="max-height:400px">${result.items.map(i=>`<label class="indicator-option"><input type="checkbox" name="indicatorIds" value="${e(i.id)}" ${selected.includes(i.id)?'checked':''}><span><strong>${e(i.code)}</strong> ${e(i.fullText)}</span></label>`).join('')||U.empty('ยังไม่มีตัวชี้วัดที่ตรงรายวิชา','นำเข้าตัวชี้วัดโดยกำหนดหลักสูตร กลุ่มสาระ และระดับชั้นให้ตรงกัน')}</div><div class="form-actions"><button type="submit" class="button primary">บันทึกชุดตัวชี้วัด</button></div></form>`);};
 U.forms['map-indicators']=async form=>{await U.callApi('mapIndicators',{subjectId:S.mapSubject.id,indicatorIds:Array.from(form.querySelectorAll('[name=indicatorIds]:checked')).map(el=>el.value)});U.close();U.toast('กำหนดตัวชี้วัดแล้ว');await U.navigate('subjects');};
})();
</script>
