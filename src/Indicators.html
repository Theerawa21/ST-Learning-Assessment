<script>
(()=>{const U=ST,{state:S,escape:e}=U;
 U.pages.indicators=async()=>{const f=S.indicatorFilters||{},data=await U.callApi('indicators',{...f,page:S.indicatorPage||1});S.indicators=data.items;U.setContent(U.heading('คลังตัวชี้วัด / ผลการเรียนรู้','ใช้ข้อมูลจากหลักสูตรที่โรงเรียนตรวจสอบแล้ว แยกตามหลักสูตรและรุ่น',U.has('ADMIN')?`<div style="display:flex;gap:8px">${U.button('นำเข้าข้อมูล','import-indicators')}${U.button('เพิ่มตัวชี้วัด','new-indicator','','primary')}</div>`:'')+`<form class="toolbar" data-form="indicator-search"><div class="search-box">${U.icon('search')}<input name="query" value="${e(f.query||'')}" placeholder="ค้นหารหัสหรือข้อความตัวชี้วัด" aria-label="ค้นหาตัวชี้วัด"></div><select name="curriculumId" aria-label="หลักสูตร">${U.options(S.boot.curricula.map(c=>({...c,label:c.name+' '+c.version})),'id','label',f.curriculumId,'ทุกหลักสูตร')}</select><select name="departmentId" aria-label="กลุ่มสาระ">${U.options(S.boot.departments,'id','name',f.departmentId,'ทุกกลุ่มสาระ')}</select><input name="grade" value="${e(f.grade||'')}" placeholder="ระดับชั้น" aria-label="ระดับชั้น" style="width:110px"><button class="button" type="submit">ค้นหา</button></form><section class="panel"><div class="table-wrap"><table><thead><tr><th>รหัส / มาตรฐาน</th><th>ข้อความตัวชี้วัด / ผลการเรียนรู้</th><th>ชั้น</th><th>ประเภท</th><th>แหล่งอ้างอิง</th>${U.has('ADMIN')?'<th>แก้ไข</th>':''}</tr></thead><tbody>${data.items.map(i=>`<tr><td><strong>${e(i.code)}</strong><small>${e(i.standard)}</small></td><td style="min-width:300px;max-width:500px">${e(i.fullText)}</td><td>${e(i.grade)}</td><td>${e(i.kind||'ไม่ระบุ')}</td><td>${e(i.reference)}</td>${U.has('ADMIN')?`<td>${U.button('แก้ไข','edit-indicator',`data-id="${e(i.id)}"`,'small')}</td>`:''}</tr>`).join('')}</tbody></table></div>${!data.total?U.empty('ยังไม่มีข้อมูลตัวชี้วัด','กรุณานำเข้าจากเอกสารหลักสูตรที่ตรวจสอบแล้ว ระบบจะไม่สร้างข้อความตัวชี้วัดขึ้นเอง'):''}${U.pager(data,'indicators-page')}</section>`);};
 U.forms['indicator-search']=form=>{S.indicatorFilters=U.formData(form);S.indicatorPage=1;return U.navigate('indicators');};U.actions['indicators-page']=el=>{S.indicatorPage=Number(el.dataset.page);return U.navigate('indicators');};
 function indicatorModal(i={}){S.editIndicator=i;U.modal(i.id?'แก้ไขตัวชี้วัด':'เพิ่มตัวชี้วัด',`<form data-form="save-indicator"><div class="form-grid">${U.selectField('curriculumId','หลักสูตร / รุ่น',U.options(S.boot.curricula,'id','name',i.curriculumId))}${U.selectField('departmentId','กลุ่มสาระ',U.options(S.boot.departments,'id','name',i.departmentId))}${U.inputField('code','รหัสตัวชี้วัด / ผลการเรียนรู้',i.code)}${U.inputField('grade','ระดับชั้น',i.grade)}<div class="field"><label for="f-standard">มาตรฐาน (ถ้ามี)</label><input id="f-standard" name="standard" value="${e(i.standard||'')}"></div><div class="field"><label for="f-kind">ประเภท (ถ้าหลักสูตรกำหนด)</label><select id="f-kind" name="kind">${U.options([{id:'ระหว่างทาง',name:'ระหว่างทาง'},{id:'ปลายทาง',name:'ปลายทาง'},{id:'ผลการเรียนรู้',name:'ผลการเรียนรู้'}],'id','name',i.kind,'ไม่ระบุ')}</select></div><div class="field full"><label for="f-fullText">ข้อความตัวชี้วัดฉบับเต็ม</label><textarea id="f-fullText" name="fullText" required>${e(i.fullText||'')}</textarea></div>${U.inputField('reference','แหล่งอ้างอิงที่ตรวจสอบแล้ว',i.reference,'text',true)}</div><div class="form-actions"><button type="submit" class="button primary">บันทึกตัวชี้วัด</button></div></form>`);}
 U.actions['new-indicator']=()=>indicatorModal();U.actions['edit-indicator']=el=>indicatorModal(S.indicators.find(i=>i.id===el.dataset.id));U.forms['save-indicator']=async form=>{await U.callApi('saveIndicator',{...U.formData(form),id:S.editIndicator.id});U.close();U.toast('บันทึกตัวชี้วัดแล้ว');await U.navigate('indicators');};
 U.actions['import-indicators']=()=>{S.importRows=[];U.modal('นำเข้าคลังตัวชี้วัด',`<form data-form="preview-import"><div class="alert">หัวคอลัมน์ที่ต้องมี: code, fullText, grade, curriculumId, departmentId, reference<br>ใช้ ID หลักสูตรและกลุ่มสาระจากหน้าตั้งค่า รองรับสูงสุด 500 แถวต่อครั้ง</div><div class="field"><label for="import-file">ไฟล์ CSV (UTF-8)</label><input id="import-file" type="file" accept=".csv,text/csv" name="file"></div><p class="muted" style="margin-top:16px">หรือนำเข้าจาก Google Sheets ที่บัญชีเจ้าของระบบอ่านได้</p><div class="form-grid"><div class="field"><label for="import-sheet">Spreadsheet ID</label><input id="import-sheet" name="spreadsheetId"></div><div class="field"><label for="import-tab">ชื่อชีต</label><input id="import-tab" name="sheetName"></div></div><div class="form-actions"><button type="submit" class="button primary">ตรวจข้อมูลก่อนนำเข้า</button></div></form><div id="import-result"></div>`);};
 U.forms['preview-import']=async form=>{const p=U.formData(form),file=form.elements.file.files[0];delete p.file;if(file){p.csv=await file.text();delete p.spreadsheetId;delete p.sheetName;}const r=await U.callApi('previewImport',p);S.importRows=r.validRows;document.getElementById('import-result').innerHTML=`<div class="alert ${r.errors.length?'error':'success'}">พร้อมนำเข้า ${r.validRows.length} แถว · ซ้ำ ${r.duplicates.length} แถว · ผิดพลาด ${r.errors.length} แถว${r.errors.length?'<ul>'+r.errors.map(x=>`<li>แถว ${x.row}: ${e(x.message)}</li>`).join('')+'</ul>':''}</div>${r.validRows.length?U.button('ยืนยันนำเข้าข้อมูลที่ผ่านตรวจ','commit-import','','primary'):''}`;};U.actions['commit-import']=async()=>{const r=await U.callApi('commitImport',{rows:S.importRows});U.close();U.toast(`นำเข้าแล้ว ${r.inserted} แถว ข้ามซ้ำ ${r.skipped} แถว`);await U.navigate('indicators');};
})();
</script>
