<script>
(()=>{const U=ST,{state:S,escape:e}=U;
 U.reportHtml=m=>`<section class="panel report-preview"><div class="panel-body"><h2>${e(m.schoolName)}</h2><h2>${e(m.title)}</h2><p style="text-align:center" class="muted">กลุ่มสาระ ${e(m.departmentName)} · ${e(m.subject.code)} ${e(m.subject.name)} · ${e(m.subject.grade)} · ภาคเรียน ${e(m.subject.term)}/${e(m.subject.year)}</p><div class="progress-row"><span>ผู้จัดทำ: ${e(m.authorName)} · รุ่น ${m.document.revision}</span>${U.status(m.document.status)}</div></div><div class="table-wrap"><table><thead><tr>${['ช่วงเวลา','ตัวชี้วัด / ผลการเรียนรู้','ประเมินอะไร','ใช้อะไรประเมิน','เกณฑ์การประเมิน'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${m.rows.map(row=>`<tr>${row.map(cell=>`<td>${e(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${!m.rows.length?U.empty('ไม่มีรายการในช่วงที่เลือก','เลือกช่วงอื่น หรือเพิ่มรายการประเมินก่อนจัดทำรายงาน'):''}<div class="panel-body"><small class="muted">${m.document.status!=='APPROVED'?'เอกสารนี้ยังไม่ใช่ฉบับอนุมัติสมบูรณ์ · ':''}ข้อมูลการรับรองดึงจากระบบ การแสดงชื่อไม่ถือเป็นลายมือชื่ออิเล็กทรอนิกส์โดยอัตโนมัติ</small>${m.reviews.length?'<div style="margin-top:15px">'+U.analysis.history(m.reviews)+'</div>':''}</div></section>`;
 U.pages.reports=async params=>{if(params.documentId)return detail(params.documentId,params.period||'');const f=S.reportFilters||{},[d,summary,authors]=await Promise.all([U.callApi('documents',{...f,year:S.year,page:S.reportPage||1}),U.callApi('dashboard',{...f,year:S.year}),U.callApi('documentAuthors',{year:S.year})]);S.reportRows=d.items;U.setContent(U.heading('รายงานและส่งออกเอกสาร','ติดตามภาพรวมและจัดทำรายงานรายวิชา แยกตามช่วงการประเมิน')+`<form class="toolbar" data-form="report-search"><select name="departmentId" aria-label="กลุ่มสาระ">${U.options(S.boot.departments,'id','name',f.departmentId,'ทุกกลุ่มสาระ')}</select><select name="teacherId" aria-label="ครูผู้จัดทำ">${U.options(authors,'id','name',f.teacherId,'ครูผู้จัดทำทุกคน')}</select><input name="grade" value="${e(f.grade||'')}" placeholder="ระดับชั้น" aria-label="ระดับชั้น" style="width:115px"><select name="term" aria-label="ภาคเรียน">${U.options([{id:'1',name:'ภาคเรียน 1'},{id:'2',name:'ภาคเรียน 2'},{id:'3',name:'ภาคเรียน 3'}],'id','name',f.term,'ทุกภาคเรียน')}</select><select name="status" aria-label="สถานะ">${U.options(Object.entries(U.labels).filter(([id])=>id!=='NOT_STARTED').map(([id,name])=>({id,name})),'id','name',f.status,'ทุกสถานะ')}</select><button class="button" type="submit">แสดงรายงาน</button></form><section class="panel" style="margin-bottom:22px"><div class="panel-header"><h2>ความก้าวหน้าแต่ละกลุ่มสาระ</h2><span class="muted">อนุมัติ ${summary.progress}%</span></div><div class="panel-body">${summary.departments.map(d=>`<div class="bar-row"><span>${e(d.name)}</span><div class="progress-track"><div class="progress-fill" style="width:${d.percent}%"></div></div><span>${d.percent}%</span></div>`).join('')||'<p class="muted">ยังไม่มีข้อมูลรายวิชาในปีที่เลือก</p>'}<small class="muted">ยังไม่จัดทำ ${summary.notStarted} · รอหัวหน้ากลุ่มสาระ ${summary.stageCounts.HEAD} · รองานวัดฯ ${summary.stageCounts.ASSESSMENT} · รอฝ่ายวิชาการ ${summary.stageCounts.ACADEMIC}</small></div></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>รายวิชา</th><th>ครูผู้จัดทำ</th><th>รุ่น</th><th>สถานะ</th><th>รายงาน</th></tr></thead><tbody>${d.items.map(r=>`<tr><td><strong>${e(r.subject.name)}</strong><small>${e(r.subject.code)} · ${e(r.subject.grade)}</small></td><td>${e(r.authorName)}</td><td>${r.revision}</td><td>${U.status(r.status)}</td><td>${U.button('ดู / ส่งออก','open-report',`data-id="${e(r.id)}"`,'small')}</td></tr>`).join('')}</tbody></table></div>${!d.total?U.empty('ยังไม่มีเอกสารรายงาน','เริ่มจากบันทึกแบบวิเคราะห์รายวิชา จากนั้นจึงเปิดดูและส่งออกได้'):''}${U.pager(d,'reports-page')}</section>`);};
 async function detail(documentId,period){const m=await U.callApi('reportModel',{documentId,period});S.reportModel=m;U.setContent(U.heading('รายงานแบบวิเคราะห์รายวิชา',m.subject.code+' · '+m.subject.name,U.button('กลับรายงานทั้งหมด','back-reports'))+`<div class="toolbar"><label>ช่วงการประเมิน <select id="report-period" aria-label="ช่วงการประเมินในรายงาน">${U.options(Object.entries(U.periods).map(([id,name])=>({id,name})),'id','name',period,'ทุกช่วง')}</select></label>${['PDF','DOCX','XLSX','GOOGLE_DOC'].map(format=>U.button(format==='GOOGLE_DOC'?'Google Docs':format,'export-report',`data-format="${format}"`,format==='PDF'?'primary':'')).join('')}</div><div id="export-result"></div>`+U.reportHtml(m));document.getElementById('report-period').addEventListener('change',ev=>detail(documentId,ev.target.value));}
 U.forms['report-search']=form=>{S.reportFilters=U.formData(form);S.reportPage=1;return U.navigate('reports');};U.actions['open-report']=el=>U.navigate('reports',{documentId:el.dataset.id});U.actions['back-reports']=()=>U.navigate('reports');U.actions['reports-page']=el=>{S.reportPage=Number(el.dataset.page);return U.navigate('reports');};
 U.actions['export-report']=async el=>{if(window.ST_PREVIEW){U.toast('โหมดทดสอบไม่สร้างไฟล์บน Google Drive กรุณาทดสอบส่งออกหลังติดตั้ง Apps Script',true);return;}const r=await U.callApi('exportReport',{documentId:S.reportModel.document.id,period:S.reportModel.period,format:el.dataset.format});if(r.download){const d=r.download,bytes=Uint8Array.from(atob(d.base64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:d.mime})),a=document.createElement('a');a.href=url;a.download=d.name;a.textContent='ดาวน์โหลด '+d.format;document.getElementById('export-result').replaceChildren(a);a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);U.toast('สร้างไฟล์ดาวน์โหลดแล้ว');return;}document.getElementById('export-result').innerHTML=`<div class="alert success">สร้างไฟล์แล้ว <a class="file-link" href="${e(U.safeUrl(r.url))}" target="_blank" rel="noopener">เปิดไฟล์ ${e(r.format)} บน Google Drive ↗</a></div>`;U.toast('สร้างรายงานแล้ว');};
})();
</script>
