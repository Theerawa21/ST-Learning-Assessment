<script>
(()=>{const U=ST,{state:S,escape:e}=U,tools=['แบบทดสอบ','แบบสังเกต','แบบประเมินชิ้นงาน','แบบประเมินการปฏิบัติ','แบบสัมภาษณ์','แบบตรวจใบงาน','Rubric','แฟ้มสะสมงาน'];
 const editable=()=>S.doc?.document?.authorId===S.user.id&&['DRAFT','REVISION_DRAFT','RETURNED_HEAD','RETURNED_ASSESSMENT','RETURNED_ACADEMIC'].includes(S.doc.document.status)||!S.doc?.document;
 const blank=()=>({indicatorIds:[],assessment:'',tools:[],periods:[],criteria:''});
 U.pages.analysis=async params=>{let data;if(params.documentId)data=await U.callApi('analysis',{documentId:params.documentId});else if(params.subjectId){const c=await U.callApi('analysisContext',{subjectId:params.subjectId});data={subject:c.subject,requiredIndicators:c.requiredIndicators,document:null,groups:[blank()],reviews:[]};}else return U.navigate('subjects');S.doc=data;S.groups=data.groups;S.dirty=false;render();};
 function render(){const d=S.doc,s=d.subject,ro=!editable(),doc=d.document,author=d.authorName||(doc?.authorId===S.user.id?S.user.name:'');U.setContent(U.heading('แบบวิเคราะห์ตัวชี้วัด / ผลการเรียนรู้','กำหนดสิ่งที่ประเมิน เครื่องมือ ช่วงเวลา และเกณฑ์ให้เชื่อมโยงกัน',U.button('กลับไปรายวิชา','go-subjects'))+`<section class="panel"><div class="panel-header"><div><h2>${e(s.code)} · ${e(s.name)}</h2><p>โรงเรียนเซนต์เทเรซา</p></div>${doc?U.status(doc.status):U.status('DRAFT')}</div><div class="analysis-header"><div class="info-item"><small>ระดับชั้น / ประเภท</small><strong>${e(s.grade)} · ${e(s.type)}</strong></div><div class="info-item"><small>ภาคเรียน / ปีการศึกษา</small><strong>${e(s.term)} / ${e(s.year)}</strong></div><div class="info-item"><small>ครูผู้จัดทำ</small><strong>${e(author||S.user.name)}</strong></div><div class="info-item"><small>ตัวชี้วัดที่ต้องวิเคราะห์ / รุ่น</small><strong>${d.requiredIndicators.length} ข้อ · รุ่น ${doc?.revision||'ยังไม่บันทึก'}</strong></div></div></section><div id="validation" style="margin-top:20px">${validationHtml(d.validation)}</div>${!d.requiredIndicators.length?'<div class="alert">รายวิชายังไม่ได้กำหนดตัวชี้วัด กรุณาให้ผู้ดูแลนำเข้าและกำหนดชุดตัวชี้วัดก่อนเริ่มวิเคราะห์</div>':''}<section class="panel" id="analysis-editor"><div class="analysis-toolbar"><strong style="margin-right:auto">ตารางวิเคราะห์ 5 คอลัมน์</strong><label class="muted">ช่วงประเมิน <select id="period-filter" aria-label="กรองช่วงการประเมิน" style="padding:6px">${U.options(Object.entries(U.periods).map(([id,name])=>({id,name})),'id','name','','ทุกช่วง')}</select></label>${!ro?U.button('+ เพิ่มรายการ','add-analysis-row','','small soft'):''}</div><div class="analysis-guide">เพิ่มรายการประเมิน แล้วเลือกช่วงเวลาและตัวชี้วัดที่เกี่ยวข้อง จากนั้นระบุสิ่งที่ประเมิน เครื่องมือ และเกณฑ์การตัดสิน</div><div class="table-wrap"><table class="analysis-table"><thead><tr><th scope="col">1. ช่วงเวลา</th><th scope="col">2. ตัวชี้วัด/ผลการเรียนรู้</th><th scope="col">3. ประเมินอะไร</th><th scope="col">4. ใช้อะไรประเมิน</th><th scope="col">5. เกณฑ์การประเมิน</th></tr></thead><tbody id="analysis-rows">${S.groups.map((g,i)=>rowHtml(g,i,ro)).join('')}</tbody></table></div></section><datalist id="criteria-presets"><option value="ได้คะแนนไม่น้อยกว่าร้อยละ 70"><option value="ได้คะแนนไม่น้อยกว่าร้อยละ 80"><option value="ผ่านระดับคุณภาพ 2 ขึ้นไป จาก 4 ระดับ"><option value="ผ่านระดับคุณภาพ 3 ขึ้นไป จาก 4 ระดับ"><option value="ผ่านเกณฑ์ตาม Rubric ที่กำหนด"></datalist><div class="sticky-actions"><div><small class="muted" id="save-hint">${doc?'บันทึกครั้งล่าสุด '+U.date(doc.updatedAt):'ยังไม่ได้บันทึกฉบับร่าง'}</small></div><div>${!ro?U.button('บันทึกฉบับร่าง','save-analysis')+U.button('ตรวจความครบถ้วน','validate-analysis')+U.button('ส่งตรวจ','submit-analysis','','primary'):''}${doc?.status==='APPROVED'&&doc.authorId===S.user.id?U.button('สร้างฉบับปรับปรุง','create-revision','','primary'):''}${doc?U.button('รายงาน / ส่งออก','analysis-report'):''}${doc&&canReview(doc)?U.button('ตรวจสอบเอกสาร','review-document',`data-id="${e(doc.id)}"`,'primary'):''}</div></div><section class="panel" style="margin-top:22px"><div class="panel-header"><h2>ประวัติการตรวจสอบและข้อเสนอแนะ</h2></div><div class="panel-body">${history(d.reviews)}</div></section>`);
 document.getElementById('period-filter').addEventListener('change',ev=>{if(!ro)collect();document.querySelectorAll('[data-analysis-row]').forEach((row,i)=>row.hidden=!!ev.target.value&&!S.groups[i].periods.includes(ev.target.value));});}
 function canReview(d){return d.authorId!==S.user.id&&(d.status==='PENDING_HEAD'&&U.has('HEAD')||d.status==='PENDING_ASSESSMENT'&&U.has('ASSESSMENT')||d.status==='PENDING_ACADEMIC'&&U.has('ACADEMIC'));}
 function rowHtml(g,index,ro){return `<tr data-analysis-row="${index}"><td><small class="muted">เลือกช่วงเวลาที่ใช้ประเมิน</small><div class="checkboxes">${Object.entries(U.periods).map(([id,name])=>`<label><input type="checkbox" data-field="period" value="${id}" ${g.periods.includes(id)?'checked':''} ${ro?'disabled':''}>${name}</label>`).join('')}</div></td><td><div class="row-number"><span>รายการที่ ${index+1}</span>${!ro?U.button('ลบ','remove-analysis-row',`data-index="${index}"`,'small'):''}</div><small class="muted">เลือกได้มากกว่า 1 ข้อ</small><div class="indicator-list">${S.doc.requiredIndicators.filter(i=>!ro||g.indicatorIds.includes(i.id)).map(i=>`<label class="indicator-option"><input type="checkbox" data-field="indicator" value="${e(i.id)}" ${g.indicatorIds.includes(i.id)?'checked':''} ${ro?'disabled':''}><span><strong>${e(i.code)}</strong><br>${e(i.fullText)}</span></label>`).join('')}</div></td><td>${ro?e(g.assessment):`<textarea data-field="assessment" aria-label="สิ่งที่ประเมิน รายการ ${index+1}" placeholder="ระบุความรู้ ทักษะ หรือคุณลักษณะที่ประเมิน">${e(g.assessment)}</textarea>`}</td><td>${ro?e(g.tools.join(' / ')):`<div class="checkboxes">${tools.map(t=>`<label><input data-field="tool" type="checkbox" value="${e(t)}" ${g.tools.includes(t)?'checked':''}>${t}</label>`).join('')}</div><textarea data-field="otherTools" aria-label="เครื่องมืออื่น รายการ ${index+1}" placeholder="เครื่องมืออื่น (บรรทัดละรายการ)" style="min-height:55px">${e(g.tools.filter(t=>!tools.includes(t)).join('\n'))}</textarea>`}</td><td>${ro?e(g.criteria):`<input list="criteria-presets" data-field="criteria" value="${e(g.criteria)}" aria-label="เกณฑ์การประเมิน รายการ ${index+1}" placeholder="เลือกเกณฑ์หรือระบุเอง" style="width:100%;font-size:12px"><small class="muted">ระบุคะแนน ระดับคุณภาพ หรือ Rubric ที่ใช้ตัดสิน</small>`}</td></tr>`;}
 function collect(){S.groups=Array.from(document.querySelectorAll('[data-analysis-row]')).map((row,index)=>({...S.groups[index],indicatorIds:Array.from(row.querySelectorAll('[data-field=indicator]:checked')).map(el=>el.value),assessment:row.querySelector('[data-field=assessment]').value,tools:[...Array.from(row.querySelectorAll('[data-field=tool]:checked')).map(el=>el.value),...row.querySelector('[data-field=otherTools]').value.split('\n').map(t=>t.trim()).filter(Boolean)],periods:Array.from(row.querySelectorAll('[data-field=period]:checked')).map(el=>el.value),criteria:row.querySelector('[data-field=criteria]').value}));return S.groups;}
 function validationHtml(v){return v?`<div class="alert ${v.canSubmit?'success':''}"><strong>ครอบคลุมตัวชี้วัด ${v.coveragePercent}%</strong> · ${v.canSubmit?'ข้อมูลครบถ้วน พร้อมส่งตรวจ':'ยังมีข้อมูลที่ต้องเติม'}${v.errors.length?'<ul>'+v.errors.map(x=>`<li>${x.row?'รายการ '+x.row+': ':''}${e(x.message)}</li>`).join('')+'</ul>':''}${v.warnings.length?'<small>ข้อสังเกต: '+v.warnings.map(w=>e(w.message)).join(' · ')+'</small>':''}</div>`:'';}
 function history(reviews=[]){return reviews.length?reviews.map(r=>`<div class="history-item"><strong>${e(r.reviewerName)} · ${e({HEAD:'หัวหน้ากลุ่มสาระ',ASSESSMENT:'งานวัดและประเมินผล',ACADEMIC:'ฝ่ายวิชาการ'}[r.stage]||r.stage)}</strong> <span class="status ${r.result==='APPROVE'?'approved':'returned'}">${r.result==='APPROVE'?'ผ่านการตรวจสอบ':'ส่งกลับแก้ไข'}</span><p>${e(r.comment||'ไม่มีความคิดเห็นเพิ่มเติม')}</p>${(r.rowComments||[]).map(c=>`<p>รายการ ${e(c.rowNumber||c.rowId)}: ${e(c.comment)}</p>`).join('')}${(r.checklist||[]).length?'<details><summary>ผลตรวจรายข้อและข้อเสนอแนะ</summary>'+r.checklist.map(c=>'<p>ข้อ '+c.number+': '+e({PASS:'ผ่าน',FIX:'ต้องแก้ไข',NA:'ไม่เกี่ยวข้อง'}[c.value])+(c.reason?' · เหตุผล: '+e(c.reason):'')+(c.comment?' · '+e(c.comment):'')+'</p>').join('')+'</details>':''}<time>รุ่น ${r.revision} · ${U.date(r.createdAt)}</time></div>`).join(''):'<p class="muted" style="margin:0;font-size:12px">ยังไม่มีประวัติการตรวจสอบ</p>';}
 async function save(){if(S.saving)throw new Error('กำลังบันทึกข้อมูล');collect();S.saving=true;const controls=Array.from(document.querySelectorAll('main button,main input,main select,main textarea')).map(el=>({el,disabled:el.disabled}));controls.forEach(({el})=>el.disabled=true);try{const d=S.doc.document,p={subjectId:S.doc.subject.id,groups:S.groups};if(d){p.documentId=d.id;p.expectedRevision=d.revision;}const r=await U.callApi('saveAnalysis',p);S.doc.document=r.document;S.doc.validation=r.validation;S.doc=await U.callApi('analysis',{documentId:r.document.id});S.groups=S.doc.groups;S.dirty=false;render();return r;}finally{S.saving=false;controls.forEach(({el,disabled})=>el.disabled=disabled);}}
 U.actions['add-analysis-row']=()=>{collect();S.groups.push(blank());S.dirty=true;render();};U.actions['remove-analysis-row']=el=>{collect();S.groups.splice(Number(el.dataset.index),1);S.dirty=true;render();};U.actions['save-analysis']=async()=>{await save();U.toast('บันทึกฉบับร่างแล้ว');};U.actions['validate-analysis']=async()=>{const r=await save();U.toast(r.validation.canSubmit?'ข้อมูลครบถ้วน พร้อมส่งตรวจ':'บันทึกแล้ว กรุณาเติมข้อมูลตามรายการที่แจ้ง',!r.validation.canSubmit);};
 U.actions['submit-analysis']=async()=>{const r=await save();if(!r.validation.canSubmit){U.toast('ข้อมูลยังไม่ครบ กรุณาตรวจรายการที่แจ้งก่อนส่ง',true);return;}U.modal('ยืนยันส่งตรวจ',`<p>ส่งแบบวิเคราะห์รายวิชา <strong>${e(S.doc.subject.name)}</strong> ให้หัวหน้ากลุ่มสาระตรวจสอบ?</p><p class="muted">เมื่อส่งแล้วจะไม่สามารถแก้ไขเนื้อหาได้จนกว่าผู้ตรวจจะส่งกลับ</p><div class="form-actions">${U.button('ยกเลิก','close-modal')}${U.button('ยืนยันส่งตรวจ','confirm-submit','','primary')}</div>`);};
 U.actions['confirm-submit']=async()=>{const d=S.doc.document;await U.callApi('submitAnalysis',{documentId:d.id,expectedRevision:d.revision});U.close();S.dirty=false;U.toast('ส่งตรวจหัวหน้ากลุ่มสาระแล้ว');await U.navigate('analysis',{documentId:d.id});};U.actions['create-revision']=async()=>{if(!confirm('สร้างฉบับปรับปรุงใหม่ โดยเก็บเอกสารอนุมัติเดิมไว้?'))return;const d=await U.callApi('createRevision',{documentId:S.doc.document.id});await U.navigate('analysis',{documentId:d.id});};U.actions['analysis-report']=()=>U.navigate('reports',{documentId:S.doc.document.id});U.analysis={history,canReview};
})();
</script>
