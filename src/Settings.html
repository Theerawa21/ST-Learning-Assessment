<script>
(()=>{const U=ST,{state:S,escape:e}=U;
 U.pages.settings=async params=>{if(!U.has('ADMIN'))throw new Error('ต้องใช้สิทธิ์ผู้ดูแลระบบ');const data=await U.callApi('adminData');S.admin=data;const tab=params.tab||S.settingsTab||'users';S.settingsTab=tab;const tabs=[['users','ผู้ใช้งาน'],['departments','กลุ่มสาระ'],['curricula','หลักสูตร'],['system','ระบบและสำรองข้อมูล'],['logs','ประวัติการใช้งาน']];let body='';if(tab==='users')body=`<div class="panel-header"><h2>ผู้ใช้งานที่ได้รับอนุญาต</h2>${U.button('เพิ่มผู้ใช้งาน','new-user','','primary')}</div><div class="table-wrap"><table><thead><tr><th>ชื่อ / อีเมล</th><th>บทบาท</th><th>สถานะ</th><th>ดำเนินการ</th></tr></thead><tbody>${data.users.map(u=>`<tr><td><strong>${e(u.name)}</strong><small>${e(u.email)}</small></td><td>${e(u.roles.map(r=>U.roleLabels[r]).join(', '))}</td><td>${u.active?'ใช้งาน':'ปิดใช้งาน'}</td><td>${U.button('แก้ไข','edit-user',`data-id="${e(u.id)}"`,'small')}</td></tr>`).join('')}</tbody></table></div>`;
 if(tab==='departments'||tab==='curricula'){const isDep=tab==='departments';body=`<div class="panel-header"><h2>${isDep?'กลุ่มสาระและผู้ตรวจแทน':'หลักสูตรและรุ่นที่ใช้งาน'}</h2>${U.button(isDep?'เพิ่มกลุ่มสาระ':'เพิ่มหลักสูตร','new-reference',`data-table="${tab}"`,'primary')}</div><div class="table-wrap"><table><thead><tr><th>ชื่อ</th><th>ID สำหรับนำเข้า</th><th>${isDep?'หัวหน้า / ผู้ตรวจแทน':'รุ่น / แหล่งอ้างอิง'}</th><th>ดำเนินการ</th></tr></thead><tbody>${data[tab].map(r=>`<tr><td><strong>${e(r.name)}</strong><small>${r.active===false?'ปิดใช้งาน':'เปิดใช้งาน'}</small></td><td><code style="font-size:10px">${e(r.id)}</code></td><td>${isDep?e([r.headUserId,r.substituteReviewerId].map(id=>data.users.find(u=>u.id===id)?.name||'ยังไม่กำหนด').join(' / ')):e(r.version+' · '+r.reference)}</td><td>${U.button('แก้ไข','edit-reference',`data-table="${tab}" data-id="${e(r.id)}"`,'small')}</td></tr>`).join('')}</tbody></table></div>${!data[tab].length?U.empty(isDep?'ยังไม่มีกลุ่มสาระ':'ยังไม่มีหลักสูตร','เพิ่มข้อมูลจริงของโรงเรียนก่อนตั้งค่ารายวิชา'):''}`;}
 if(tab==='system')body=`<div class="panel-header"><h2>ความพร้อมและการสำรองข้อมูล</h2></div><div class="panel-body">${data.checks.map(c=>`<p><span class="status ${c.ok?'approved':'returned'}">${c.ok?'พร้อม':'ต้องตั้งค่า'}</span> ${e(c.name)} ${e(c.message||'')}</p>`).join('')}<p class="muted">อีเมลแจ้งเตือน: ${data.emailEnabled?'เปิดใช้งาน':'ปิดใช้งาน'} · เปลี่ยน EMAIL_ENABLED ใน Script Properties โดยผู้ดูแลโครงการ</p><div class="toolbar">${U.button('สำรองข้อมูลตอนนี้','backup-now','','primary')}${U.button('ติดตั้ง Trigger อัตโนมัติ','install-triggers')}</div><div id="system-result"></div><h3>ไฟล์สำรอง</h3><p class="muted">กู้คืนเป็น Spreadsheet สำเนาเท่านั้น ไม่เขียนทับฐานข้อมูลใช้งานจริง</p>${data.backups.map(b=>`<div class="progress-row" style="padding:10px 0;border-bottom:1px solid var(--border)"><span>${e(b.name)}</span>${U.button('กู้คืนเป็นสำเนา','restore-copy',`data-id="${e(b.id)}"`,'small')}</div>`).join('')||'<p class="muted">ยังไม่มีไฟล์สำรอง</p>'}${data.operations.length?'<h3 style="margin-top:20px">คำสั่งค้างที่ต้องกู้คืน</h3>'+data.operations.map(o=>`<div class="alert error">${e(o.operation)} · ${e(o.id)} ${U.button('กู้คืนก่อนทำรายการ','recover-operation',`data-id="${e(o.id)}"`,'small')}</div>`).join(''):''}</div>`;
 if(tab==='logs')body=`<div class="panel-header"><h2>ประวัติการทำรายการ 100 รายการล่าสุด</h2></div><div class="table-wrap"><table><thead><tr><th>เวลา</th><th>ผู้ดำเนินการ</th><th>คำสั่ง</th><th>รหัสคำสั่ง</th></tr></thead><tbody>${data.logs.map(l=>`<tr><td>${U.date(l.createdAt)}</td><td>${e(data.users.find(u=>u.id===l.actorId)?.name||l.actorId)}</td><td>${e(l.action)}</td><td><small>${e(l.requestId)}</small></td></tr>`).join('')}</tbody></table></div>`;
 U.setContent(U.heading('ตั้งค่าระบบ','จัดการข้อมูลหลัก สิทธิ์ผู้ใช้ และตรวจสอบความพร้อมของระบบ')+`<div class="tabs" role="tablist">${tabs.map(([id,label])=>`<button class="tab ${tab===id?'active':''}" role="tab" aria-selected="${tab===id}" data-action="settings-tab" data-tab="${id}">${label}</button>`).join('')}</div><section class="panel">${body}</section>`);};
 U.actions['settings-tab']=el=>U.navigate('settings',{tab:el.dataset.tab});
 function userModal(u={}){S.editUser=u;U.modal(u.id?'แก้ไขผู้ใช้งาน':'เพิ่มผู้ใช้งาน',`<form data-form="save-user"><div class="form-grid">${U.inputField('name','ชื่อ–นามสกุล',u.name)}${U.inputField('email','บัญชี Google ที่ได้รับอนุญาต',u.email,'email')}<div class="field full"><label>บทบาท (เลือกได้หลายบทบาท)</label><div class="checkboxes">${Object.entries(U.roleLabels).map(([id,label])=>`<label><input name="roles" type="checkbox" value="${id}" ${(u.roles||[]).includes(id)?'checked':''}>${label}</label>`).join('')}</div></div><label class="checkboxes"><input name="active" type="checkbox" ${u.active!==false?'checked':''}> เปิดใช้งานบัญชี</label></div><div class="form-actions"><button class="button primary" type="submit">บันทึกผู้ใช้งาน</button></div></form>`);}
 U.actions['new-user']=()=>userModal();U.actions['edit-user']=el=>userModal(S.admin.users.find(u=>u.id===el.dataset.id));U.forms['save-user']=async form=>{const p=U.formData(form);p.id=S.editUser.id;p.roles=Array.from(form.querySelectorAll('[name=roles]:checked')).map(el=>el.value);p.active=form.elements.active.checked;await U.callApi('saveUser',p);U.close();U.toast('บันทึกผู้ใช้งานแล้ว');await U.navigate('settings',{tab:'users'});};
 function referenceModal(table,r={}){S.editReference={table,record:r};const isDep=table==='departments',heads=S.admin.users.filter(u=>u.active&&u.roles.includes('HEAD'));U.modal(isDep?'ข้อมูลกลุ่มสาระ':'ข้อมูลหลักสูตร',`<form data-form="save-reference"><div class="form-grid">${U.inputField('name',isDep?'ชื่อกลุ่มสาระ':'ชื่อหลักสูตร',r.name,'text',true)}${isDep?U.selectField('headUserId','หัวหน้ากลุ่มสาระ',U.options(heads,'id','name',r.headUserId))+U.selectField('substituteReviewerId','ผู้ตรวจแทน',U.options(heads,'id','name',r.substituteReviewerId,'ยังไม่กำหนด')):U.inputField('version','รุ่นหลักสูตร',r.version)+U.inputField('startYear','ปีเริ่มใช้',r.startYear||S.year)+U.inputField('reference','แหล่งอ้างอิง',r.reference,'text',true)}<label class="checkboxes"><input name="active" type="checkbox" ${r.active!==false?'checked':''}> เปิดใช้งาน</label></div><div class="form-actions"><button class="button primary" type="submit">บันทึกข้อมูล</button></div></form>`);if(isDep)document.getElementById('f-substituteReviewerId').required=false;}
 U.actions['new-reference']=el=>referenceModal(el.dataset.table);U.actions['edit-reference']=el=>referenceModal(el.dataset.table,S.admin[el.dataset.table].find(r=>r.id===el.dataset.id));U.forms['save-reference']=async form=>{const p=U.formData(form);p.id=S.editReference.record.id;p.active=form.elements.active.checked;await U.callApi(S.editReference.table==='departments'?'saveDepartment':'saveCurriculum',p);U.close();S.boot=await U.callApi('bootstrap');U.toast('บันทึกข้อมูลหลักแล้ว');await U.navigate('settings',{tab:S.editReference.table});};
 U.actions['backup-now']=async()=>{if(window.ST_PREVIEW){U.toast('โหมดทดสอบไม่สร้างไฟล์บน Google Drive',true);return;}await U.callApi('backup');U.toast('สำรองข้อมูลเรียบร้อย');await U.navigate('settings',{tab:'system'});};U.actions['install-triggers']=async()=>{if(window.ST_PREVIEW){U.toast('ติดตั้ง Trigger ได้หลังเผยแพร่บน Apps Script เท่านั้น',true);return;}await U.callApi('installTriggers');U.toast('ติดตั้ง Trigger แล้ว');};
 U.actions['restore-copy']=async el=>{if(!confirm('สร้างฐานข้อมูลสำเนาจากไฟล์สำรองนี้? ฐานข้อมูลปัจจุบันจะไม่ถูกเปลี่ยน'))return;const r=await U.callApi('restore',{backupId:el.dataset.id});document.getElementById('system-result').innerHTML=`<div class="alert success">${e(r.message)}<a href="${e(U.safeUrl(r.url))}" class="file-link" target="_blank" rel="noopener">เปิด Spreadsheet สำเนา ↗</a></div>`;};U.actions['recover-operation']=async el=>{if(!confirm('กู้คืนข้อมูลก่อนคำสั่งค้างนี้? กรุณาตรวจสถานะและไฟล์ snapshot ก่อนดำเนินการ'))return;await U.callApi('recoverOperation',{id:el.dataset.id});U.toast('กู้คืนคำสั่งค้างแล้ว');await U.navigate('settings',{tab:'system'});};
})();
</script>
