<script>
window.ST=(()=>{
 const S={user:null,boot:null,page:'dashboard',year:'2569',idToken:null,sessionToken:null,doc:null,groups:[],pageNumber:1,admin:null,importRows:[]};
 const pages={},actions={},forms={};let transport=null,toastTimer;const pendingRequests=new Map();
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const paths={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',book:'M3 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H3z M21 4h-6a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h5z',library:'M4 3v18 M8 3v18 M13 3v18 M17 4l4 16',check:'M9 12l2 2 4-5 M8 3h8v4H8z M6 5H4v16h16V5h-2',report:'M14 2H4v20h16V8z M14 2v6h6 M8 12h8 M8 16h8',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9 M10 21h4',plus:'M12 5v14 M5 12h14',search:'M21 21l-5-5 M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14',arrow:'M5 12h14 M13 6l6 6-6 6',file:'M14 2H4v20h16V8z M14 2v6h6',clock:'M12 8v5l3 2 M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20',shield:'M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6z M8 12l3 3 5-6',logout:'M9 3H3v18h6 M14 7l5 5-5 5 M8 12h12'};
 const icon=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="${paths[name]||paths.file}"/></svg>`;
 const labels={NOT_STARTED:'ยังไม่จัดทำ',DRAFT:'ฉบับร่าง',REVISION_DRAFT:'ฉบับปรับปรุง',PENDING_HEAD:'รอหัวหน้ากลุ่มสาระ',PENDING_ASSESSMENT:'รองานวัดและประเมินผล',PENDING_ACADEMIC:'รอฝ่ายวิชาการ',RETURNED_HEAD:'กลุ่มสาระส่งกลับ',RETURNED_ASSESSMENT:'งานวัดฯ ส่งกลับ',RETURNED_ACADEMIC:'ฝ่ายวิชาการส่งกลับ',APPROVED:'อนุมัติสมบูรณ์'};
 const periods={BEFORE_MIDTERM:'ก่อนกลางภาค',MIDTERM:'กลางภาค',AFTER_MIDTERM:'หลังกลางภาค',FINAL:'ปลายภาค'};
 const roleLabels={ADMIN:'ผู้ดูแลระบบ',TEACHER:'ครูผู้สอน',HEAD:'หัวหน้ากลุ่มสาระ',ASSESSMENT:'งานวัดและประเมินผล',ACADEMIC:'ฝ่ายวิชาการ'};
 const status=v=>`<span class="status ${String(v).startsWith('PENDING')?'pending':v==='APPROVED'?'approved':String(v).startsWith('RETURNED')?'returned':''}">${esc(labels[v]||v)}</span>`;
 const has=role=>(S.user?.roles||[]).includes(role);
 const date=v=>v?new Date(v).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'—';
 async function callApi(action,payload={},requestId){const key=JSON.stringify([S.user?.id,action,payload]);const read=['bootstrap','subjects','indicators','dashboard','documents','queue','users','adminData','analysis','analysisContext','subjectMapping','reportModel','notifications','documentAuthors'].includes(action);const id=requestId||(!read&&pendingRequests.get(key))||crypto.randomUUID();if(!read)pendingRequests.set(key,id);const req={action,payload,requestId:id,idToken:S.idToken,sessionToken:S.sessionToken};let r;if(transport)r=await transport(req);else r=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(req));pendingRequests.delete(key);if(!r?.ok){const error=new Error(r?.error?.message||'ไม่สามารถเชื่อมต่อระบบได้');error.code=r?.error?.code;throw error;}return r.data;}
 function toast(message,error=false){const el=document.getElementById('toast');if(!el)return;clearTimeout(toastTimer);el.textContent=message;el.className='toast'+(error?' error':'');el.hidden=false;toastTimer=setTimeout(()=>{el.hidden=true;},error?10000:4500);}
 const button=(label,action,attrs='',variant='')=>`<button class="button ${variant}" data-action="${action}" ${attrs}>${esc(label)}</button>`;
 function heading(title,subtitle,action=''){return `<div class="page-heading"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${action}</div>`;}
 function empty(title,desc,action=''){return `<div class="empty-state"><div class="empty-icon">${icon('file')}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p>${action}</div>`;}
 function pager(data,action){return `<div class="pagination"><span>ทั้งหมด ${data.total} รายการ</span><div class="pagination-controls">${button('ก่อนหน้า',action,`data-page="${Math.max(1,data.page-1)}" ${data.page<=1?'disabled':''}`,'small')}<span>หน้า ${data.page}</span>${button('ถัดไป',action,`data-page="${data.page+1}" ${data.page*data.pageSize>=data.total?'disabled':''}`,'small')}</div></div>`;}
 function modal(title,body){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;const d=document.getElementById('modal');if(!d.open)d.showModal();}
 const close=()=>document.getElementById('modal').close();async function allItems(action,payload={}){let items=[],page=1;while(true){const r=await callApi(action,{...payload,page,pageSize:100});items.push(...r.items);if(items.length>=r.total)return items;if(page++>=50)throw new Error('จำนวนข้อมูลมากเกินช่วงที่โหลดได้ กรุณาเพิ่มตัวกรอง');}}
 function options(rows,valueKey='id',labelKey='name',selected='',blank='เลือก'){return (blank!==null?`<option value="">${esc(blank)}</option>`:'')+rows.map(r=>`<option value="${esc(r[valueKey])}" ${(Array.isArray(selected)?selected.includes(r[valueKey]):String(selected)===String(r[valueKey]))?'selected':''}>${esc(r[labelKey])}</option>`).join('');}
 function inputField(name,label,value='',type='text',full=false){return `<div class="field ${full?'full':''}"><label for="f-${esc(name)}">${esc(label)}</label><input id="f-${esc(name)}" name="${esc(name)}" type="${type}" value="${esc(value)}" required></div>`;}
 function selectField(name,label,opts,multiple=false,full=false){return `<div class="field ${full?'full':''}"><label for="f-${esc(name)}">${esc(label)}</label><select id="f-${esc(name)}" name="${esc(name)}" ${multiple?'multiple':'required'}>${opts}</select>${multiple?'<small>กด Ctrl / Cmd เพื่อเลือกหลายรายการ</small>':''}</div>`;}
 const formData=form=>Object.fromEntries(new FormData(form).entries());
 const allSelected=(form,name)=>Array.from(form.elements.namedItem(name)?.selectedOptions||[]).map(o=>o.value);
 function setContent(html){document.getElementById('content').innerHTML=html;}
 async function navigate(page,params={}){if(S.saving){toast('กำลังบันทึกข้อมูล กรุณารอสักครู่');return;}if(S.dirty&&!confirm('มีการแก้ไขที่ยังไม่ได้บันทึก ต้องการออกจากหน้านี้หรือไม่?'))return;S.dirty=false;S.page=page;document.getElementById('sidebar').classList.remove('open');document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));setContent('<div class="loading-state"><span class="spinner"></span><p>กำลังโหลดข้อมูล</p></div>');try{if(!pages[page])throw new Error('ไม่พบหน้าที่เรียก');await pages[page](params);await updateNotifications();}catch(e){setContent(`<div class="alert error">${esc(e.message)}</div>${button('ลองใหม่','retry-page')}`);} }
 function safeUrl(url){try{const u=new URL(url);if(u.protocol==='https:'&&['drive.google.com','docs.google.com'].includes(u.hostname))return u.href;}catch(e){}return '#';}
 async function updateNotifications(){try{const list=await callApi('notifications');const count=list.filter(n=>!n.readAt).length;const el=document.getElementById('notification-count');el.textContent=count;el.hidden=!count;}catch(e){/* User flow remains available; notification errors do not fake success. */}}
 async function init(){
  if(window.ST_HOST)transport=window.ST_HOST.request;
  if(window.ST_PREVIEW){document.body.classList.add('preview');document.getElementById('preview-banner').hidden=false;document.getElementById('preview-banner').innerHTML='<strong>โหมดทดสอบในเครื่อง · ไม่ใช่ข้อมูลโรงเรียนจริง</strong><button data-action="preview-seed">โหลดชุดทดสอบ</button><select id="preview-role" aria-label="บัญชีทดสอบ"><option value="admin@school.test">ผู้ดูแลทดสอบ</option><option value="teacher@school.test">ครูทดสอบ</option><option value="head@school.test">หัวหน้ากลุ่มสาระทดสอบ</option><option value="assessment@school.test">งานวัดฯ ทดสอบ</option><option value="academic@school.test">ฝ่ายวิชาการทดสอบ</option></select>';transport=req=>fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)}).then(r=>r.json());}
  try{S.boot=await callApi('bootstrap');S.user=S.boot.user;document.body.classList.remove('auth-page');if(window.ST_PREVIEW)document.getElementById('preview-role').value=S.user.email;document.getElementById('user-name').textContent=S.user.name;document.getElementById('user-role').textContent=S.user.roles.map(r=>roleLabels[r]).join(' / ');document.getElementById('avatar').textContent=S.user.name.slice(0,2);document.getElementById('bell-icon').innerHTML=icon('bell');const nav=[['dashboard','ภาพรวม','dashboard'],['subjects','รายวิชาของฉัน','book'],['indicators','คลังตัวชี้วัด','library']];if(S.user.roles.some(r=>['HEAD','ASSESSMENT','ACADEMIC'].includes(r)))nav.push(['reviews','งานรอตรวจ','check']);nav.push(['reports','รายงาน','report']);if(has('ADMIN'))nav.push(['settings','ตั้งค่าระบบ','settings']);document.getElementById('nav').innerHTML=nav.map(([page,name,i])=>`<a href="#${page}" class="nav-item" data-page="${page}">${icon(i)}<span>${esc(name)}</span></a>`).join('')+button('ออกจากระบบ','logout','','link');await callApi('recordLogin',{});await navigate('dashboard');}
  catch(e){document.body.classList.add('auth-page');if(!window.ST_PREVIEW&&!window.ST_GOOGLE_LOGIN){if(e.code==='SESSION'){S.sessionToken=null;sessionStorage.removeItem('st.session');}showNameLogin(e);return;}if(S.idToken&&e.code==='ACCESS'){try{const info=await callApi('registrationInfo');if(!info.registered&&info.enabled){showRegistration(info);return;}}catch(ignore){e=ignore;}}setContent(`<div class="welcome-layout"><section class="welcome-story"><div class="welcome-brand"><span class="brand-mark">ST</span><div><strong>ST-Learning Assessment</strong><small>โรงเรียนเซนต์เทเรซา · Saint Theresa School</small></div></div><h1>ออกแบบการประเมิน<br>เพื่อการเรียนรู้ที่ดีขึ้น</h1><p class="welcome-intro">พื้นที่ทำงานของครู เชื่อมหลักสูตร ตัวชี้วัด และการวัดประเมินผลไว้ด้วยกัน ตั้งแต่การวางแผนจนถึงการตรวจอนุมัติ</p><div class="welcome-flow"><div><span>01</span><p><strong>วางแผนให้ครบถ้วน</strong><small>เชื่อมตัวชี้วัดและผลการเรียนรู้กับรายวิชา</small></p></div><div><span>02</span><p><strong>จัดทำแบบวิเคราะห์</strong><small>กำหนดเครื่องมือ เกณฑ์ และช่วงเวลาประเมิน</small></p></div><div><span>03</span><p><strong>ส่งตรวจและติดตามผล</strong><small>ตรวจสอบสถานะและจัดเก็บรายงานในที่เดียว</small></p></div></div><div class="welcome-bottom">วางแผนอย่างเป็นระบบ <span>·</span> พัฒนาการเรียนรู้</div></section><section class="login-panel"><div class="login-symbol">${icon('book')}</div><h2>ยินดีต้อนรับ</h2><p class="login-description">เข้าสู่พื้นที่ทำงานของคุณ<br>ด้วยบัญชี Google ที่ใช้งานประจำ</p><div id="google-signin"><span class="muted">กำลังเตรียมการเข้าสู่ระบบ…</span></div><div class="login-divider"><span>สำหรับผู้ใช้งานครั้งแรก</span></div><p class="signup-explainer">เลือกบัญชี Google แล้วกรอกข้อมูลเบื้องต้น<br>สมัครเป็นครูและเริ่มใช้งานได้ทันที</p><div class="login-note">${icon('check')} ยืนยันตัวตนด้วย Google<br><span>ไม่ต้องตั้งรหัสผ่านใหม่สำหรับเว็บไซต์</span></div>${e.code==='IDENTITY'?'':`<div class="alert error" role="alert">${esc(e.message.replace(/^[A-Z_]+:\s*/,''))}</div>`}<button class="login-retry" data-action="retry-login">ตรวจสอบบัญชีอีกครั้ง</button></section></div>`);if(window.ST_HOST){window.ST_HOST.renderSignIn(document.getElementById('google-signin'));return;}if(!window.ST_PREVIEW&&typeof google!=='undefined')google.script.run.withSuccessHandler(config=>{if(config.authMode==='OAUTH'&&config.oauthClientId&&config.redirectUri){const state=crypto.randomUUID()+crypto.randomUUID();sessionStorage.setItem('st.oauth.state',state);const query=new URLSearchParams({client_id:config.oauthClientId,redirect_uri:config.redirectUri,response_type:'id_token',scope:'openid email',nonce:state,state:state,prompt:'select_account'});const a=document.createElement('a');a.className='button primary';a.target='_top';a.textContent='เข้าสู่ระบบ / สมัครด้วย Google';a.href='https:'+String.fromCharCode(47,47)+'accounts.google.com/o/oauth2/v2/auth?'+query;document.getElementById('google-signin').replaceChildren(a);}}).loginConfig();}
 }

 function showNameLogin(error){
  setContent('<section class="login-panel" style="width:min(600px,100%);text-align:left"><h1>เข้าสู่ระบบ ST-Learning</h1><p class="muted">ค้นหาชื่อ เลือกบัญชี แล้วใส่รหัสเข้าใช้งาน</p><form data-form="find-login-name"><label class="field" for="login-query">ค้นหาชื่อ–นามสกุล<input id="login-query" name="query" minlength="2" maxlength="100" required placeholder="พิมพ์ชื่ออย่างน้อย 2 ตัวอักษร" autocomplete="off"></label><button class="button" type="submit" style="margin-top:12px">ค้นหาชื่อ</button></form><form data-form="password-login" style="margin-top:20px"><label class="field" for="login-user">เลือกชื่อ<select id="login-user" name="userId" required><option value="">ค้นหาชื่อก่อน</option></select></label><label class="field" for="login-password" style="margin-top:14px">รหัสเข้าใช้งาน<input id="login-password" name="password" type="password" required maxlength="128" autocomplete="current-password"></label><button class="button primary" type="submit" style="width:100%;margin-top:20px">เข้าสู่ระบบ</button></form><p class="muted" style="font-size:12px;margin-top:14px">ครูใช้รหัสที่โรงเรียนกำหนด · ผู้ดูแลใช้รหัสส่วนตัว</p><div id="name-login-error" class="alert error" hidden></div>'+button('ผู้ดูแล: ตั้งรหัสครั้งแรก / กู้คืนผ่าน Google','admin-google-login','','link')+'</section>');
  if(error&&!['IDENTITY','SESSION'].includes(error.code)){const el=document.getElementById('name-login-error');el.hidden=false;el.textContent=error.message;}
 }
 forms['find-login-name']=async form=>{const list=await callApi('loginNames',formData(form));document.getElementById('login-user').innerHTML=options(list,'id','name','','เลือกชื่อของคุณ');if(!list.length)toast('ไม่พบชื่อ กรุณาติดต่อผู้ดูแลเพิ่มบัญชี',true);};
 forms['password-login']=async form=>{const el=document.getElementById('name-login-error');try{const result=await callApi('passwordLogin',formData(form));S.sessionToken=result.sessionToken;sessionStorage.setItem('st.session',result.sessionToken);form.elements.password.value='';window.ST_GOOGLE_LOGIN=false;await init();}catch(error){el.hidden=false;el.textContent=error.message;}};
 actions['admin-google-login']=()=>{window.ST_GOOGLE_LOGIN=true;return init();};
 actions['logout']=async()=>{try{await callApi('logout');}finally{S.sessionToken=null;S.idToken=null;sessionStorage.removeItem('st.session');window.ST_GOOGLE_LOGIN=false;S.user=null;await init();}};
 function showRegistration(info){setContent(`<section class="panel" style="max-width:720px;margin:32px auto"><h1>สมัครเข้าใช้งาน</h1><p class="muted">ยืนยัน Gmail แล้ว: ${esc(info.email)} · สมัครแล้วใช้งานได้ทันทีในบทบาทครู</p><form data-form="register-teacher"><div class="form-grid">${inputField('name','ชื่อ–นามสกุล','','text',true)}${inputField('position','ตำแหน่ง','ครูผู้สอน')}${inputField('department','กลุ่มสาระที่สอน','')}${inputField('grades','ระดับชั้นที่สอน','')}${inputField('phone','เบอร์โทรศัพท์ (ไม่บังคับ)','','tel')}${inputField('registrationCode','รหัสสมัครเข้าโรงเรียน','','password')}<p class="muted field full">ข้อมูลนี้ใช้จัดทำบัญชีและเอกสารวิเคราะห์รายวิชา อีเมลยึดตามบัญชี Google ของคุณ</p></div><div class="form-actions"><button type="submit" class="button primary">สมัครและเข้าใช้งานทันที</button></div><div id="registration-error" class="alert error" hidden></div></form></section>`);document.getElementById('f-phone').required=false;}
 forms['register-teacher']=async form=>{const error=document.getElementById('registration-error');try{await callApi('register',formData(form));toast('สมัครเรียบร้อยแล้ว ยินดีต้อนรับ');await init();}catch(e){error.hidden=false;error.textContent=e.message;}};
 actions['toggle-menu']=()=>document.getElementById('sidebar').classList.toggle('open');actions['close-modal']=close;actions['retry-page']=()=>navigate(S.page);actions['retry-login']=init;
 actions.notifications=async()=>{const list=await callApi('notifications');S.notifications=list;modal('การแจ้งเตือน',list.length?list.map(n=>`<button class="notification-item button link ${!n.readAt?'unread':''}" style="width:100%;text-align:left" data-action="open-notification" data-id="${esc(n.id)}">${esc(n.message)}<time>${date(n.createdAt)}</time></button>`).join(''):empty('ยังไม่มีการแจ้งเตือน','เมื่อมีการส่งตรวจหรือเปลี่ยนสถานะ จะแสดงที่นี่'));};
 actions['open-notification']=async el=>{const n=S.notifications.find(n=>n.id===el.dataset.id);await callApi('readNotification',{id:n.id});close();await navigate('analysis',{documentId:n.documentId});};
 actions['preview-seed']=async()=>{await fetch('/preview/seed',{method:'POST'});await init();toast('โหลดข้อมูลทดสอบในหน่วยความจำแล้ว');};
 document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page].nav-item');if(nav){e.preventDefault();navigate(nav.dataset.page);return;}const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=actions[el.dataset.action];if(!fn)return;e.preventDefault();el.disabled=true;try{await fn(el);}catch(error){toast(error.message,true);}finally{el.disabled=false;}});
 document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;try{await forms[f.dataset.form](f);}catch(error){toast(error.message,true);}finally{if(btn)btn.disabled=false;}});
 document.addEventListener('change',async e=>{if(e.target.id==='global-year'){if(!/^\d{4}$/.test(e.target.value)){toast('ปีการศึกษาต้องเป็นเลข 4 หลัก',true);return;}S.year=e.target.value;await navigate(S.page);}if(e.target.id==='preview-role'){await fetch('/preview/identity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.target.value})});await init();}if(e.target.closest('#analysis-editor'))S.dirty=true;});
 document.addEventListener('input',e=>{if(e.target.closest('#analysis-editor'))S.dirty=true;});
 async function startApp(){
  try{S.sessionToken=sessionStorage.getItem('st.session')||null;}catch(ignore){}

  if(!window.ST_PREVIEW&&typeof google!=='undefined'&&google.script?.url){
   try{const location=await new Promise(resolve=>google.script.url.getLocation(resolve));const params=new URLSearchParams(location.hash||'');
    if(params.has('id_token')){const token=params.get('id_token'),expected=sessionStorage.getItem('st.oauth.state');const claim=JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
     google.script.history.replace({}, {}, '');sessionStorage.removeItem('st.oauth.state');
     if(!expected||params.get('state')!==expected||claim.nonce!==expected)throw Error('ไม่สามารถยืนยันการเข้าสู่ระบบ กรุณาลองใหม่');
     S.idToken=token;
    }
   }catch(error){setContent('<div class="alert error">'+esc(error.message)+'</div>'+button('ตรวจสอบบัญชีอีกครั้ง','retry-login','','primary'));return;}
  }
  await init();
