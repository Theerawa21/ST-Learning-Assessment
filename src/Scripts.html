<script>
window.ST=(()=>{
 const S={user:null,boot:null,page:'dashboard',year:'2569',idToken:null,doc:null,groups:[],pageNumber:1,admin:null,importRows:[]};
 const pages={},actions={},forms={};let transport=null,toastTimer;const pendingRequests=new Map();
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const paths={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',book:'M3 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H3z M21 4h-6a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h5z',library:'M4 3v18 M8 3v18 M13 3v18 M17 4l4 16',check:'M9 12l2 2 4-5 M8 3h8v4H8z M6 5H4v16h16V5h-2',report:'M14 2H4v20h16V8z M14 2v6h6 M8 12h8 M8 16h8',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9 M10 21h4',plus:'M12 5v14 M5 12h14',search:'M21 21l-5-5 M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14',arrow:'M5 12h14 M13 6l6 6-6 6',file:'M14 2H4v20h16V8z M14 2v6h6',clock:'M12 8v5l3 2 M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20',shield:'M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6z M8 12l3 3 5-6',logout:'M9 3H3v18h6 M14 7l5 5-5 5 M8 12h12'};
 const icon=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="${paths[name]||paths.file}"/></svg>`;
 const labels={NOT_STARTED:'ยังไม่จัดทำ',DRAFT:'ฉบับร่าง',REVISION_DRAFT:'ฉบับปรับปรุง',PENDING_HEAD:'รอหัวหน้ากลุ่มสาระ',PENDING_ASSESSMENT:'รองานวัดและประเมินผล',PENDING_ACADEMIC:'รอฝ่ายวิชาการ',RETURNED_HEAD:'กลุ่มสาระส่งกลับ',RETURNED_ASSESSMENT:'งานวัดฯ ส่งกลับ',RETURNED_ACADEMIC:'ฝ่ายวิชาการส่งกลับ',APPROVED:'อนุมัติสมบูรณ์'};
 const periods={BEFORE_MIDTERM:'ก่อนกลางภาค',MIDTERM:'กลางภาค',AFTER_MIDTERM:'หลังกลางภาค',FINAL:'ปลายภาค'};
 const roleLabels={ADMIN:'ผู้ดูแลระบบ',TEACHER:'ครูผู้สอน',HEAD:'หัวหน้ากลุ่มสาระ',ASSESSMENT:'งานวัดและประเมินผล',ACADEMIC:'ฝ่ายวิชาการ'};
 const status=v=>`<span class="status ${String(v).startsWith('PENDING')?'pending':v==='APPROVED'?'approved':String(v).startsWith('RETURNED')?'returned':''}">${esc(labels[v]||v)}</span>`;
 const has=role=>(S.user?.roles||[]).includes(role);
 const date=v=>v?new Date(v).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'—';
 async function callApi(action,payload={},requestId){const key=JSON.stringify([S.user?.id,action,payload]);const read=['bootstrap','subjects','indicators','dashboard','documents','queue','users','adminData','analysis','analysisContext','subjectMapping','reportModel','notifications','documentAuthors'].includes(action);const id=requestId||(!read&&pendingRequests.get(key))||crypto.randomUUID();if(!read)pendingRequests.set(key,id);const req={action,payload,requestId:id,idToken:S.idToken};let r;if(transport)r=await transport(req);else r=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(req));pendingRequests.delete(key);if(!r?.ok)throw new Error(r?.error?.message||'ไม่สามารถเชื่อมต่อระบบได้');return r.data;}
 function toast(message,error=false){const el=document.getElementById('toast');if(!el)return;clearTimeout(toastTimer);el.textContent=message;el.className='toast'+(error?' error':'');el.hidden=false;toastTimer=setTimeout(()=>{el.hidden=true;},error?10000:4500);}
 const button=(label,action,attrs='',variant='')=>`<button class="button ${variant}" data-action="${action}" ${attrs}>${esc(label)}</button>`;
 function heading(title,subtitle,action=''){return `<div class="page-heading"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${action}</div>`;}
 function empty(title,desc,action=''){return `<div class="empty-state"><div class="empty-icon">${icon('file')}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p>${action}</div>`;}
 function pager(data,action){return `<div class="pagination"><span>ทั้งหมด ${data.total} รายการ</span><div class="pagination-controls">${button('ก่อนหน้า',action,`data-page="${Math.max(1,data.page-1)}" ${data.page<=1?'disabled':''}`,'small')}<span>หน้า ${data.page}</span>${button('ถัดไป',action,`data-page="${data.page+1}" ${data.page*data.pageSize>=data.total?'disabled':''}`,'small')}</div></div>`;}
 function modal(title,body){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;const d=document.getElementById('modal');if(!d.open)d.showModal();}
 const close=()=>document.getElementById('modal').close();async function allItems(action,payload={}){let items=[],page=1;while(true){const r=await callApi(action,{...payload,page,pageSize:100});items.push(...r.items);if(items.length>=r.total)return items;if(page++>=50)throw new Error('จำนวนข้อมูลมากเกินช่วงที่โหลดได้ กรุณาเพิ่มตัวกรอง');}}
 function options(rows,valueKey='id',labelKey='name',selected='',blank='เลือก'){return (blank!==null?`<option value="">${esc(blank)}</option>`:'')+rows.map(r=>`<option value="${esc(r[valueKey])}" ${(Array.isArray(selected)?selected.includes(r[valueKey]):String(selected)===String(r[valueKey]))?'selected':''}>${esc(r[labelKey])}</option>`).join('');}
 function inputField(name,label,value='',type='text',full=false){return `<div class="field ${full?'full':''}"><label for="f-${esc(name)}">${esc(label)}</label><input id="f-${esc(name)}" name="${esc(name)}" type="${type}" value="${esc(value)}" required></div>`;}
 function selectField(name,label,opts,multiple=false,full=false){return `<div class="field ${full?'full':''}"><label for="f-${esc(name)}">${esc(label)}</label><select id="f-${esc(name)}" name="${esc(name)}" ${multiple?'multiple':'required'}>${opts}</select>${multiple?'<small>กด Ctrl / Cmd เพื่อเลือกหลายรายการ</small>':''}</div>`;}
 const formData=form=>Object.fromEntries(new FormData(form).entries());
 const allSelected=(form,name)=>Array.from(form.elements.namedItem(name)?.selectedOptions||[]).map(o=>o.value);
 function setContent(html){document.getElementById('content').innerHTML=html;}
 async function navigate(page,params={}){if(S.saving){toast('กำลังบันทึกข้อมูล กรุณารอสักครู่');return;}if(S.dirty&&!confirm('มีการแก้ไขที่ยังไม่ได้บันทึก ต้องการออกจากหน้านี้หรือไม่?'))return;S.dirty=false;S.page=page;document.getElementById('sidebar').classList.remove('open');document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));setContent('<div class="loading-state"><span class="spinner"></span><p>กำลังโหลดข้อมูล</p></div>');try{if(!pages[page])throw new Error('ไม่พบหน้าที่เรียก');await pages[page](params);await updateNotifications();}catch(e){setContent(`<div class="alert error">${esc(e.message)}</div>${button('ลองใหม่','retry-page')}`);} }
 function safeUrl(url){try{const u=new URL(url);if(u.protocol==='https:'&&['drive.google.com','docs.google.com'].includes(u.hostname))return u.href;}catch(e){}return '#';}
 async function updateNotifications(){try{const list=await callApi('notifications');const count=list.filter(n=>!n.readAt).length;const el=document.getElementById('notification-count');el.textContent=count;el.hidden=!count;}catch(e){/* User flow remains available; notification errors do not fake success. */}}
 async function init(){
  if(window.ST_PREVIEW){document.body.classList.add('preview');document.getElementById('preview-banner').hidden=false;document.getElementById('preview-banner').innerHTML='<strong>โหมดทดสอบในเครื่อง · ไม่ใช่ข้อมูลโรงเรียนจริง</strong><button data-action="preview-seed">โหลดชุดทดสอบ</button><select id="preview-role" aria-label="บัญชีทดสอบ"><option value="admin@school.test">ผู้ดูแลทดสอบ</option><option value="teacher@school.test">ครูทดสอบ</option><option value="head@school.test">หัวหน้ากลุ่มสาระทดสอบ</option><option value="assessment@school.test">งานวัดฯ ทดสอบ</option><option value="academic@school.test">ฝ่ายวิชาการทดสอบ</option></select>';transport=req=>fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)}).then(r=>r.json());}
  try{S.boot=await callApi('bootstrap');S.user=S.boot.user;if(window.ST_PREVIEW)document.getElementById('preview-role').value=S.user.email;document.getElementById('user-name').textContent=S.user.name;document.getElementById('user-role').textContent=S.user.roles.map(r=>roleLabels[r]).join(' / ');document.getElementById('avatar').textContent=S.user.name.slice(0,2);document.getElementById('bell-icon').innerHTML=icon('bell');const nav=[['dashboard','ภาพรวม','dashboard'],['subjects','รายวิชาของฉัน','book'],['indicators','คลังตัวชี้วัด','library']];if(S.user.roles.some(r=>['HEAD','ASSESSMENT','ACADEMIC'].includes(r)))nav.push(['reviews','งานรอตรวจ','check']);nav.push(['reports','รายงาน','report']);if(has('ADMIN'))nav.push(['settings','ตั้งค่าระบบ','settings']);document.getElementById('nav').innerHTML=nav.map(([page,name,i])=>`<a href="#${page}" class="nav-item" data-page="${page}">${icon(i)}<span>${esc(name)}</span></a>`).join('');await callApi('recordLogin',{});await navigate('dashboard');}
  catch(e){setContent(`<div class="login-panel"><span class="brand-mark">ST</span><h1>เข้าสู่ระบบ ST-Learning</h1><p class="muted">เฉพาะบัญชีที่โรงเรียนอนุญาต</p><div class="alert error">${esc(e.message)}</div><div id="google-signin"></div>${button('ตรวจสอบบัญชีอีกครั้ง','retry-login','','primary')}<p class="muted" style="margin-top:18px;font-size:11px">หากยังเข้าไม่ได้ กรุณาให้ผู้ดูแลตรวจรายชื่อผู้ใช้และการตั้งค่า Deployment</p></div>`);if(!window.ST_PREVIEW&&typeof google!=='undefined')google.script.run.withSuccessHandler(config=>{if(config.authMode==='OAUTH'&&config.oauthClientId){const script=document.createElement('script');script.src='https:\x2f\x2faccounts.google.com/gsi/client';script.onload=()=>{google.accounts.id.initialize({client_id:config.oauthClientId,callback:response=>{S.idToken=response.credential;init();}});google.accounts.id.renderButton(document.getElementById('google-signin'),{theme:'outline',size:'large',text:'signin_with',locale:'th'});};document.head.append(script);}}).loginConfig();}
 }
 actions['toggle-menu']=()=>document.getElementById('sidebar').classList.toggle('open');actions['close-modal']=close;actions['retry-page']=()=>navigate(S.page);actions['retry-login']=init;
 actions.notifications=async()=>{const list=await callApi('notifications');S.notifications=list;modal('การแจ้งเตือน',list.length?list.map(n=>`<button class="notification-item button link ${!n.readAt?'unread':''}" style="width:100%;text-align:left" data-action="open-notification" data-id="${esc(n.id)}">${esc(n.message)}<time>${date(n.createdAt)}</time></button>`).join(''):empty('ยังไม่มีการแจ้งเตือน','เมื่อมีการส่งตรวจหรือเปลี่ยนสถานะ จะแสดงที่นี่'));};
 actions['open-notification']=async el=>{const n=S.notifications.find(n=>n.id===el.dataset.id);await callApi('readNotification',{id:n.id});close();await navigate('analysis',{documentId:n.documentId});};
 actions['preview-seed']=async()=>{await fetch('/preview/seed',{method:'POST'});await init();toast('โหลดข้อมูลทดสอบในหน่วยความจำแล้ว');};
 document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page].nav-item');if(nav){e.preventDefault();navigate(nav.dataset.page);return;}const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=actions[el.dataset.action];if(!fn)return;e.preventDefault();el.disabled=true;try{await fn(el);}catch(error){toast(error.message,true);}finally{el.disabled=false;}});
 document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;try{await forms[f.dataset.form](f);}catch(error){toast(error.message,true);}finally{if(btn)btn.disabled=false;}});
 document.addEventListener('change',async e=>{if(e.target.id==='global-year'){if(!/^\d{4}$/.test(e.target.value)){toast('ปีการศึกษาต้องเป็นเลข 4 หลัก',true);return;}S.year=e.target.value;await navigate(S.page);}if(e.target.id==='preview-role'){await fetch('/preview/identity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.target.value})});await init();}if(e.target.closest('#analysis-editor'))S.dirty=true;});
 document.addEventListener('input',e=>{if(e.target.closest('#analysis-editor'))S.dirty=true;});
 document.addEventListener('DOMContentLoaded',init);
 return {state:S,pages,actions,forms,escape:esc,icon,status,labels,periods,roleLabels,has,date,callApi,setTransport:t=>transport=t,toast,button,heading,empty,pager,modal,close,options,inputField,selectField,formData,allSelected,setContent,navigate,safeUrl,allItems,init};
})();
</script>
