<!doctype html><html><head><meta charset="utf-8"></head><body><script>
(()=>{
 const allowedOrigins=['https://theerawa21.github.io','https://st-learning-assessment-hosting.web.app','https://st-learning-assessment-hosting.firebaseapp.com'];
 google.script.url.getLocation(location=>{
  const channel=location.parameter.channel,allowedOrigin=location.parameter.origin||allowedOrigins[0];
  if(!allowedOrigins.includes(allowedOrigin))return;
  if(typeof channel!=='string'||!/^[a-f0-9-]{36}$/.test(channel))return;
  function reply(message){window.top.postMessage({...message,channel},allowedOrigin);}
  window.addEventListener('message',event=>{
   if(event.origin!==allowedOrigin||event.source!==window.top)return;
   const data=event.data;
   if(!data||data.channel!==channel||data.type!=='st:request'||typeof data.id!=='string')return;
   if(!data.request||JSON.stringify(data.request).length>100000)return;
   google.script.run.withSuccessHandler(result=>reply({type:'st:response',id:data.id,result}))
    .withFailureHandler(()=>reply({type:'st:response',id:data.id,result:{ok:false,error:{code:'CONNECTION',message:'ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่'}}})).api(data.request);
  });
  reply({type:'st:ready'});
 });
})();
</script></body></html>
